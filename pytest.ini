[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Coverage flags live only in the Makefile `test` target, so plain `pytest` stays fast.
# tests/core_only runs only in the no-extras venv of `make test-core-only`.
addopts = -v --strict-markers --ignore=tests/core_only
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
