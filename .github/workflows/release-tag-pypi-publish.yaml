name: Publish to PyPI on release tag

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build and publish to pypi
        uses: JRubics/poetry-publish@v2.1
        with:
          python_version: "3.12"
          pypi_token: ${{ secrets.PYPI_TOKEN }}