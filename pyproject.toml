# Only [project], [dependency-groups], [tool.poetry], [build-system] live here; every tool is
# configured in its own root file: ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
[project]
name = "mapping-suite-sdk"
version = "1.1.0"
description = "Software development kit for XML-RML mapping rules packaging"
authors = [
    { name = "meaningfy.ws", email = "hi@meaningfy.ws" }
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Only what mapping_suite_sdk/ imports, ranged to the next major (DEC-2, DEC-3).
dependencies = [
    "pydantic>=2.10,<3",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "gitpython>=3.1,<4",
    "pymongo>=4.11,<5",
    "typer>=0.16,<1",
]

[project.scripts]
mssdk = "mapping_suite_sdk.tools.entrypoints.cli.mssdk:mssdk_cli_command"

[dependency-groups]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "mongomock>=4.3,<5",
]
lint = [
    "ruff>=0.14,<0.15",
    "mypy>=1.13,<2",
    "import-linter>=2.6,<3",
]
# Development only: generates the v3 and mapping-suite models from resources/schema (make generate-models).
model = [
    "linkml>=1.12,<1.13",
]

[tool.poetry]
packages = [{ include = "mapping_suite_sdk" }]
include = [
    { path = "resources", format = "sdist" },
    { path = "resources", format = "wheel" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
