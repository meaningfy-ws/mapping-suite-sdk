[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Coverage flags live only in the Makefile `test` target, so plain `pytest` stays fast.
addopts = -v --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
