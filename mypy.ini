[mypy]
# Non-strict baseline (DEC-6); tightening is a later change.
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_configs = True
explicit_package_bases = True
pretty = True
# Generated by `make generate-models`; their style is the generator's.
exclude = (?x)(
    ^mapping_suite_sdk/mapping_package_v3/models/mapping_package_v3.*\.py$
    | ^mapping_suite_sdk/mapping_suite/models/mapping_suite\.py$
  )
