# SonarQube Cloud Automatic Analysis (free plan, public repo): analysed by the Sonar GitHub app,
# no CI step and no token. Coverage is not imported here; Codecov owns coverage.
sonar.sources=mapping_suite_sdk
sonar.tests=tests
sonar.exclusions=docs/**/*,**/*.md
sonar.cpd.exclusions=tests/**/*
sonar.python.version=3.10, 3.11, 3.12, 3.13
