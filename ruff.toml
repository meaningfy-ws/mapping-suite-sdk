# Ruff — linter + formatter (replaces pylint, radon/xenon; DEC-4, P-1).
line-length = 127
target-version = "py310"
# Generated by `make generate-models`; their style is the generator's.
extend-exclude = [
    "mapping_suite_sdk/mapping_package_v3/models/mapping_package_v3*.py",
    "mapping_suite_sdk/mapping_suite/models/mapping_suite.py",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
]
# The formatter enforces line-length on code; what E501 still flags are long strings,
# comments and docstrings it cannot wrap.
ignore = ["E501"]

[lint.per-file-ignores]
# typer.Argument/Option in defaults is typer's documented idiom, not a mutable default.
"mapping_suite_sdk/tools/entrypoints/cli/*.py" = ["B008"]

[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
