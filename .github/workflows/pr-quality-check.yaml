name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for commenting on PRs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libsqlite3-dev
          make install

      - name: Run generate LinkML models
        run: make generate-models

      - name: Verify generated code is up to date
        id: verify_generated_code
        run: |
          echo "Checking if generated models match LinkML schemas..."
          if ! git diff --quiet mapping_suite_sdk/; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Generated code is out of sync!"
            exit 1
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Generated code is up to date ✓"
          fi

      - name: Comment on PR about out-of-sync code
        if: github.event_name == 'pull_request' && failure() && steps.verify_generated_code.outputs.has_changes == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## ⚠️ Generated Code Out of Sync with LinkML schemas

            The Python models in `mapping_suite_sdk/` are out of sync with the LinkML schemas in `linkml/`.

            **To fix this locally:**
            ```bash
            make test-unit
            git add mapping_suite_sdk/
            git commit -m "chore: regenerate models from LinkML schemas"
            git push
            ```

            Please regenerate the models locally and push the changes to update this PR.
          comment_tag: generated_code_check

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Comment on PR that generated code is in sync
        if: github.event_name == 'pull_request' && success() && steps.verify_generated_code.outputs.has_changes == 'false'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## ✅ Generated Code is in Sync with LinkML schemas

            The Python models in `mapping_suite_sdk/` are up to date with the LinkML schemas in `linkml/`.
          comment_tag: generated_code_check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}