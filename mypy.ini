[mypy]
# Non-strict baseline (DEC-6); tightening is a later change.
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_configs = True
explicit_package_bases = True
pretty = True
# Generated by `make generate-models`; their style is the generator's.
exclude = (?x)(
    ^mapping_suite_sdk/mapping_package_v3/models/mapping_package_v3.*\.py$
    | ^mapping_suite_sdk/mapping_suite/models/mapping_suite\.py$
  )

# shortcut: the modules below carried mypy errors when the baseline was set (163 errors,
# mostly the env_property descriptor, the generic PydanticModel and per-version loader
# variables); fixing them is a refactor. Remove a module from these lists once it is clean,
# at the latest in modular-core (#94), which reshapes this code.
[mypy-mapping_suite_sdk.core.adapters.config_resolver,mapping_suite_sdk.core.adapters.loader,mapping_suite_sdk.core.adapters.repository,mapping_suite_sdk.core.adapters.serialiser,mapping_suite_sdk.core.adapters.validator,mapping_suite_sdk.core.adapters.version_detector,mapping_suite_sdk.core.config,mapping_suite_sdk.core.models.collection_asset,mapping_suite_sdk.core.models.jsonld]
ignore_errors = True

[mypy-mapping_suite_sdk.mapping_package_v1.adapters.mp_v1_hasher,mapping_suite_sdk.mapping_package_v1.adapters.mp_v1_serialiser,mapping_suite_sdk.mapping_package_v1.adapters.mp_v1_validator,mapping_suite_sdk.mapping_package_v1,mapping_suite_sdk.mapping_package_v1.models,mapping_suite_sdk.mapping_package_v1.services.load_mapping_package_v1,mapping_suite_sdk.mapping_package_v1.services.validate_mapping_package_v1]
ignore_errors = True

[mypy-mapping_suite_sdk.mapping_package_v2.adapters.mp_v2_hasher,mapping_suite_sdk.mapping_package_v2.adapters.mp_v2_serialiser,mapping_suite_sdk.mapping_package_v2.adapters.mp_v2_validator,mapping_suite_sdk.mapping_package_v2,mapping_suite_sdk.mapping_package_v2.models,mapping_suite_sdk.mapping_package_v2.services.load_mapping_package_v2,mapping_suite_sdk.mapping_package_v2.services.validate_mapping_package_v2]
