# This workflow updates the PyLint badge in README.md by running the same canonical
# command used in PR checks (make lint-report), ensuring consistency between the badge
# score and the pylint output developers see in PRs.
#
# Why run on pull_request instead of push?
# - The main and develop branches are protected and cannot be pushed to directly
# - Running on push to these branches would fail when trying to commit back
# - Running on PRs allows updating the badge in the PR branch before merging
# - The updated badge is then included in the PR and merged with the other changes
name: Update badges

# DEPRECATED: This workflow has been deprecated to avoid confusion and badge mismatches.
# 
# The authoritative source for PyLint checks is: .github/workflows/pr-pylint-check.yaml
# That workflow runs on all PRs, generates pylint_report.txt, and posts results as PR comments.
#
# This workflow caused issues where the badge score in README differed from actual pylint output
# (e.g., PR #61 showed mismatches). To maintain clarity and consistency, badge updates are no
# longer automated.
#
# If you need to manually update the badge, you can trigger this workflow via workflow_dispatch,
# but please consider whether a static badge indicator is more appropriate.

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  update-pylint-badge:
    name: Update PyLint Badge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout the PR head branch (not the base branch) so we can commit to it
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Persist credentials so we can push back to the PR branch
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libsqlite3-dev
          make install

      # Run the canonical lint command used in PR checks
      - name: Run Pylint report (canonical command)
        run: make lint-report

      # Extract and validate the score from pylint_report.txt
      - name: Extract and validate Pylint score
        id: pylint_score
        run: |
          # Check if report exists
          if [ ! -f pylint_report.txt ]; then
            echo "::error::pylint_report.txt not found"
            exit 1
          fi

          # Extract score from report
          # Expected format: "Pylint: Your code has been rated at X.XX/10"
          SCORE=$(grep -oP "rated at \K[0-9]+\.[0-9]+" pylint_report.txt || echo "")

          if [ -z "$SCORE" ]; then
            echo "::error::Could not extract Pylint score from report"
            cat pylint_report.txt
            exit 1
          fi

          echo "Extracted score: $SCORE"

          # Format score with 2 decimals
          FORMATTED_SCORE=$(printf "%.2f" $SCORE)
          echo "score=$FORMATTED_SCORE" >> $GITHUB_OUTPUT
          echo "Badge will be updated with score: $FORMATTED_SCORE"

      # Update the README badge with the extracted score
      - name: Update README badge
        run: |
          SCORE="${{ steps.pylint_score.outputs.score }}"
          # Update the shields.io badge URL in README.md
          sed -i "s|PyLint-[0-9]\+\.[0-9]\+|PyLint-$SCORE|g" README.md

          # Check if there are changes
          if git diff --quiet README.md; then
            echo "No changes to badge - score is already $SCORE"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "Badge updated to score: $SCORE"
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      # Commit and push the changes (only if there are changes and not from a fork)
      - name: Commit and push badge update
        if: env.has_changes == 'true' && github.event.pull_request.head.repo.fork == false
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: Update PyLint badge to ${{ steps.pylint_score.outputs.score }}"

          # Push to the PR head branch (not the protected base branch)
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
