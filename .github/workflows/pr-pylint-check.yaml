name: Pylint Quality check

on:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Pylint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for commenting on PRs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libsqlite3-dev
          make install

      - name: Run Pylint with report
        id: pylint
        continue-on-error: true
        run: |
          make lint-report
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check if report exists
        id: check_report
        run: |
          if [ -f pylint_report.txt ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            cat pylint_report.txt
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Pylint Comment
        if: always() && steps.check_report.outputs.report_exists == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pylint_report.txt
          comment_tag: pylint

      - name: Fail if Pylint score is too low
        if: steps.pylint.outputs.exit_code != '0'
        run: |
          echo "::error::Pylint found issues. Please fix them."
          exit 1