# Ruff — linter + formatter (replaces pylint, radon/xenon; DEC-4, P-1).
line-length = 127
target-version = "py310"
# Generated by `make generate-models`; their style is the generator's.
extend-exclude = [
    "mapping_suite_sdk/mapping_package_v3/models/mapping_package_v3*.py",
    "mapping_suite_sdk/mapping_suite/models/mapping_suite.py",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
]

[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
